<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notas - UFPS</title>
  <link rel="stylesheet" href="css/style.css">
  <script defer src="js/app.js"></script>
</head>
<body>
  <div class="container">
    <img src="img/logoU.png" alt="UFPS Logo" class="logo">
    <div class="info">
      <p><b>Código:</b> <span id="codigoEst"></span></p>
      <p><b>Nombre:</b> <span id="nombreEst"></span></p>
      <p><b>Promedio:</b> <span id="promedioEst"></span></p>
    </div>
    <table>
      <thead>
        <tr>
          <th>Asignatura</th>
          <th>Créditos</th>
          <th>P1</th>
          <th>P2</th>
          <th>P3</th>
          <th>EF</th>
          <th>DEF</th>
        </tr>
      </thead>
      <tbody id="tablaNotas"></tbody>
    </table>
    <button id="logoutBtn">Cerrar Sesión</button>
  </div>
</body>
</html>
